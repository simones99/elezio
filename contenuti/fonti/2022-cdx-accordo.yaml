# Copia canonica: quella depositata da Fratelli d'Italia (lista n. 68).
# Le tre copie depositate (FdI 19 pagine, Lega 14, FI 18) sono lo stesso
# accordo con impaginazioni diverse. Passate da Mistral OCR e confrontate con
# il PDF nativo dell'accordo pubblicato da ANSA (300 citazioni da 15 parole,
# seme 28, come nel ticket #28), passano la verifica: FdI 98,3%, FI 94,3%,
# Lega 80,0%. Il contenuto è completo in tutte e tre: tolta l'intestazione
# ripetuta, coprono il testo di riferimento al 99,9% (FdI), 99,6% (FI) e
# 99,4% (Lega). La copia Lega perde punti perché ha un'altra intestazione
# ("PER L'ITALIA LEGA SALVINI", titolo "Programma per un Governo di
# centrodestra") e qualche parola incollata dall'OCR ("crisieconomica").
# FdI è la copia con meno errori. Misura del 30 ottobre 2026, ticket #27.
